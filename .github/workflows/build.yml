name: Build Pixel1Photos TrollFools

on:
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      THEOS: /home/runner/theos

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            clang \
            llvm \
            make \
            perl \
            git \
            curl \
            wget \
            xz-utils \
            bzip2 \
            unzip \
            dpkg \
            libtinfo6 \
            file \
            xxd


      # ==========================================
      # THEOS
      # ==========================================

      - name: Install Theos
        run: |
          set -e

          rm -rf "$THEOS"

          git clone --recursive \
            https://github.com/theos/theos.git \
            "$THEOS"

          echo
          echo "=========================================="
          echo "THEOS INSTALLED"
          echo "=========================================="

          echo "THEOS=$THEOS"

          test -d "$THEOS"

          ls -lah "$THEOS"


      # ==========================================
      # IOS TOOLCHAIN
      # ==========================================

      - name: Install iOS Linux Toolchain
        run: |
          set -e

          mkdir -p "$THEOS/toolchain"

          echo
          echo "=========================================="
          echo "DOWNLOAD IOS TOOLCHAIN"
          echo "=========================================="

          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz" \
            -o /tmp/iOSToolchain-x86_64.tar.xz

          echo
          echo "=========================================="
          echo "EXTRACT IOS TOOLCHAIN"
          echo "=========================================="

          tar -xJf \
            /tmp/iOSToolchain-x86_64.tar.xz \
            -C "$THEOS/toolchain"

          echo
          echo "=========================================="
          echo "TOOLCHAIN FILES"
          echo "=========================================="

          find "$THEOS/toolchain" \
            -maxdepth 5 \
            -type f \
            | head -150


      # ==========================================
      # VERIFY TOOLCHAIN
      # ==========================================

      - name: Verify Toolchain
        run: |
          set -e

          echo
          echo "=========================================="
          echo "VERIFY TOOLCHAIN"
          echo "=========================================="

          echo "THEOS=$THEOS"

          test -d "$THEOS"

          test -d \
            "$THEOS/toolchain/linux/iphone"

          test -x \
            "$THEOS/toolchain/linux/iphone/bin/clang"

          echo
          echo "Clang:"

          "$THEOS/toolchain/linux/iphone/bin/clang" \
            --version

          echo
          echo "Toolchain bin directory:"

          ls -lah \
            "$THEOS/toolchain/linux/iphone/bin"


      # ==========================================
      # IOS SDK
      # ==========================================

      - name: Download iOS 16.5 SDK
        run: |
          set -e

          mkdir -p "$THEOS/sdks"

          echo
          echo "=========================================="
          echo "DOWNLOAD IPHONEOS 16.5 SDK"
          echo "=========================================="

          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz" \
            -o /tmp/iPhoneOS16.5.sdk.tar.xz

          echo
          echo "=========================================="
          echo "EXTRACT SDK"
          echo "=========================================="

          tar -xJf \
            /tmp/iPhoneOS16.5.sdk.tar.xz \
            -C "$THEOS/sdks"

          echo
          echo "=========================================="
          echo "INSTALLED SDKS"
          echo "=========================================="

          ls -lah "$THEOS/sdks"

          test -d \
            "$THEOS/sdks/iPhoneOS16.5.sdk"


      # ==========================================
      # VERIFY THEOS
      # ==========================================

      - name: Verify Theos
        run: |
          set -e

          echo
          echo "=========================================="
          echo "VERIFY THEOS"
          echo "=========================================="

          echo "THEOS=$THEOS"

          test -d "$THEOS"

          test -d \
            "$THEOS/sdks/iPhoneOS16.5.sdk"

          test -d \
            "$THEOS/toolchain/linux/iphone"

          echo
          echo "SDK:"

          ls -lah \
            "$THEOS/sdks"

          echo
          echo "iPhoneOS16.5.sdk:"

          ls -lah \
            "$THEOS/sdks/iPhoneOS16.5.sdk" \
            | head -50

          echo
          echo "Toolchain:"

          ls -lah \
            "$THEOS/toolchain/linux/iphone/bin"


      # ==========================================
      # VERIFY PROJECT
      # ==========================================

      - name: Verify Project Files
        run: |
          set -e

          echo
          echo "=========================================="
          echo "PROJECT"
          echo "=========================================="

          pwd

          echo
          echo "Files:"

          ls -lah

          echo
          echo "=========================================="
          echo "MAKEFILE"
          echo "=========================================="

          test -f Makefile

          cat Makefile

          echo
          echo "=========================================="
          echo "TWEAK.X"
          echo "=========================================="

          test -f Tweak.x

          sed -n '1,260p' Tweak.x

          echo
          echo "=========================================="
          echo "PLIST"
          echo "=========================================="

          test -f Pixel1Photos.plist

          cat Pixel1Photos.plist


      # ==========================================
      # BUILD
      # ==========================================

      - name: Build dylib
        run: |
          set -e

          echo
          echo "=========================================="
          echo "BUILD PIXEL1PHOTOS"
          echo "=========================================="

          echo "THEOS=$THEOS"

          make clean || true

          make \
            FINALPACKAGE=1 \
            THEOS="$THEOS"


      # ==========================================
      # FIND DYLIB
      # ==========================================

      - name: Find dylib
        run: |
          set -e

          echo
          echo "=========================================="
          echo "SEARCH DYLIB"
          echo "=========================================="

          find .theos \
            -type f \
            -name "*.dylib" \
            -print


      # ==========================================
      # PREPARE TROLLFOOLS
      # ==========================================

      - name: Prepare TrollFools Files
        run: |
          set -e

          mkdir -p output

          DYLIB=$(find .theos \
            -type f \
            -name "Pixel1Photos.dylib" \
            | head -n 1)

          if [ -z "$DYLIB" ]; then
            echo
            echo "ERROR: Pixel1Photos.dylib NOT FOUND"
            echo

            find .theos \
              -type f \
              -name "*.dylib" \
              -print

            exit 1
          fi

          echo
          echo "=========================================="
          echo "FOUND DYLIB"
          echo "=========================================="

          echo "$DYLIB"

          cp "$DYLIB" \
            output/Pixel1Photos.dylib

          cp Pixel1Photos.plist \
            output/Pixel1Photos.plist

          echo
          echo "=========================================="
          echo "TROLLFOOLS OUTPUT"
          echo "=========================================="

          ls -lah output/


      # ==========================================
      # VERIFY OUTPUT
      # ==========================================

      - name: Verify Output
        run: |
          set -e

          echo
          echo "=========================================="
          echo "OUTPUT"
          echo "=========================================="

          ls -lah output/

          echo
          echo "=========================================="
          echo "DYLIB FILE"
          echo "=========================================="

          file output/Pixel1Photos.dylib

          echo
          echo "=========================================="
          echo "DYLIB SIZE"
          echo "=========================================="

          stat \
            -c "%n %s bytes" \
            output/Pixel1Photos.dylib

          echo
          echo "=========================================="
          echo "MACH-O MAGIC"
          echo "=========================================="

          xxd \
            -l 32 \
            output/Pixel1Photos.dylib

          echo
          echo "=========================================="
          echo "THEOS LLVM OBJDUMP"
          echo "=========================================="

          if [ -x \
            "$THEOS/toolchain/linux/iphone/bin/llvm-objdump" \
          ]; then

            "$THEOS/toolchain/linux/iphone/bin/llvm-objdump" \
              -private-headers \
              output/Pixel1Photos.dylib \
              | head -100 || true

          else

            echo "Theos llvm-objdump not found."
            echo "Skipping Mach-O header inspection."

          fi


      # ==========================================
      # FINAL CHECK
      # ==========================================

      - name: Final Check
        run: |
          set -e

          echo
          echo "=========================================="
          echo "FINAL TROLLFOOLS PACKAGE"
          echo "=========================================="

          test -f output/Pixel1Photos.dylib
          test -f output/Pixel1Photos.plist

          echo
          echo "SUCCESS"
          echo

          ls -lah output/


      # ==========================================
      # ARTIFACT
      # ==========================================

      - name: Upload TrollFools Files
        uses: actions/upload-artifact@v4
        with:
          name: Pixel1Photos-TrollFools
          path: output/
          if-no-files-found: error
