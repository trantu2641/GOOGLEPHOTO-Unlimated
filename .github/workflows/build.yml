name: Build TrollFools Dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            clang \
            make \
            perl \
            git \
            wget \
            xz-utils \
            ldid

      - name: Install Theos
        run: |
          git clone --recursive \
            https://github.com/theos/theos.git \
            "$HOME/theos"

      - name: Download iOS 16.5 SDK
        run: |
          mkdir -p "$HOME/theos/sdks"

          wget -q \
            https://github.com/theos/sdks/releases/download/16.5/iPhoneOS16.5.sdk.tar.xz \
            -O /tmp/sdk.tar.xz

          tar -xf /tmp/sdk.tar.xz \
            -C "$HOME/theos/sdks"

      - name: Build
        env:
          THEOS: ${{ github.workspace }}/../theos
        run: |
          make clean
          make FINALPACKAGE=1

      - name: Prepare TrollFools files
        run: |
          mkdir -p output

          find .theos \
            -type f \
            -name "Pixel1Photos.dylib" \
            -exec cp {} output/ \;

          cp Pixel1Photos.plist output/

      - name: Check architecture
        run: |
          file output/Pixel1Photos.dylib

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Pixel1Photos-TrollFools
          path: output/
