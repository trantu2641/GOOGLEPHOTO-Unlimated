name: Build Pixel1Photos TrollFools

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            clang \
            llvm \
            make \
            perl \
            git \
            curl \
            wget \
            xz-utils \
            bzip2 \
            unzip \
            dpkg

      - name: Install Theos
        run: |
          git clone --recursive \
            https://github.com/theos/theos.git \
            "$HOME/theos"

      - name: Download SDK
        run: |
          set -e

          mkdir -p "$HOME/theos/sdks"

          echo "Downloading iPhoneOS SDK..."

          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            "https://github.com/theos/sdks/releases/download/15.2/iPhoneOS15.2.sdk.tar.xz" \
            -o /tmp/iPhoneOS.sdk.tar.xz

          echo "Extracting SDK..."

          tar -xJf \
            /tmp/iPhoneOS.sdk.tar.xz \
            -C "$HOME/theos/sdks"

          echo "SDK contents:"
          find "$HOME/theos/sdks" -maxdepth 2 -type d -print

      - name: Verify Theos
        env:
          THEOS: ${{ github.workspace }}/../theos
        run: |
          echo "THEOS=$THEOS"

          test -d "$THEOS"
          test -d "$THEOS/sdks"

          echo "Available SDKs:"
          ls -lah "$THEOS/sdks"

      - name: Build dylib
        env:
          THEOS: ${{ github.workspace }}/../theos
        run: |
          set -e

          make clean || true

          make \
            FINALPACKAGE=1 \
            THEOS="$THEOS"

      - name: Find dylib
        run: |
          echo "Searching for dylib..."

          find .theos \
            -type f \
            -name "*.dylib" \
            -print

      - name: Prepare TrollFools files
        run: |
          set -e

          mkdir -p output

          DYLIB=$(find .theos \
            -type f \
            -name "Pixel1Photos.dylib" \
            | head -n 1)

          if [ -z "$DYLIB" ]; then
            echo "ERROR: Pixel1Photos.dylib not found"
            exit 1
          fi

          cp "$DYLIB" \
            output/Pixel1Photos.dylib

          cp Pixel1Photos.plist \
            output/Pixel1Photos.plist

      - name: Verify output
        run: |
          echo "===== OUTPUT ====="

          ls -lah output/

          echo
          echo "===== DYLIB ====="

          file output/Pixel1Photos.dylib

          echo
          echo "===== MACH-O ====="

          llvm-objdump -p \
            output/Pixel1Photos.dylib \
            | head -80

      - name: Upload TrollFools dylib
        uses: actions/upload-artifact@v4
        with:
          name: Pixel1Photos-TrollFools
          path: output/
