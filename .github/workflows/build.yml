      # ==========================================
      # BUILD
      # ==========================================

      - name: Build dylib
        run: |
          set -e

          echo "=========================================="
          echo "BUILD"
          echo "=========================================="

          echo "THEOS=$THEOS"

          make clean || true

          make \
            FINALPACKAGE=1 \
            THEOS="$THEOS"

          echo
          echo "=========================================="
          echo "THEOS BUILD OUTPUT"
          echo "=========================================="

          find .theos \
            -type f \
            -print


      # ==========================================
      # LOCATE FINAL DYLIB
      # ==========================================

      - name: Locate final dylib
        run: |
          set -e

          echo "=========================================="
          echo "LOCATING FINAL DYLIB"
          echo "=========================================="

          echo
          echo "Possible dylibs:"

          find .theos \
            -type f \
            -name "*.dylib" \
            -print

          echo
          echo "Expected output:"

          find .theos/obj \
            -type f \
            -name "Pixel1Photos.dylib" \
            -print

          DYLIB=$(find .theos/obj \
            -type f \
            -name "Pixel1Photos.dylib" \
            | head -n 1)

          if [ -z "$DYLIB" ]; then
            echo
            echo "ERROR: Final Pixel1Photos.dylib not found"
            exit 1
          fi

          echo
          echo "FINAL DYLIB:"
          echo "$DYLIB"

          echo "$DYLIB" > /tmp/final_dylib_path


      # ==========================================
      # MACH-O HEADER CHECK
      # ==========================================

      - name: Inspect Mach-O
        run: |
          set -e

          DYLIB=$(cat /tmp/final_dylib_path)

          echo "=========================================="
          echo "MACH-O INSPECTION"
          echo "=========================================="

          echo
          echo "FILE:"
          file "$DYLIB"

          echo
          echo "SIZE:"
          stat -c "%s bytes" "$DYLIB"

          echo
          echo "MAGIC:"
          od \
            -An \
            -tx1 \
            -N32 \
            "$DYLIB"

          echo
          echo "LDID:"
          "$THEOS/toolchain/linux/iphone/bin/ldid" \
            -h \
            "$DYLIB" \
            || true


      # ==========================================
      # TEST LDID
      # ==========================================

      - name: Test ldid
        run: |
          set -e

          DYLIB=$(cat /tmp/final_dylib_path)

          echo "=========================================="
          echo "TEST LDID"
          echo "=========================================="

          cp "$DYLIB" \
            /tmp/Pixel1Photos-test.dylib

          "$THEOS/toolchain/linux/iphone/bin/ldid" \
            -S \
            /tmp/Pixel1Photos-test.dylib

          echo
          echo "LDID SUCCESS"


      # ==========================================
      # PREPARE TROLLFOOLS
      # ==========================================

      - name: Prepare TrollFools Files
        run: |
          set -e

          DYLIB=$(cat /tmp/final_dylib_path)

          mkdir -p output

          cp "$DYLIB" \
            output/Pixel1Photos.dylib

          cp Pixel1Photos.plist \
            output/Pixel1Photos.plist

          echo
          echo "=========================================="
          echo "TROLLFOOLS OUTPUT"
          echo "=========================================="

          ls -lah output/


      # ==========================================
      # FINAL VERIFY
      # ==========================================

      - name: Final Verify
        run: |
          set -e

          echo "=========================================="
          echo "FINAL VERIFY"
          echo "=========================================="

          test -f output/Pixel1Photos.dylib
          test -f output/Pixel1Photos.plist

          echo
          echo "DYLIB:"
          file output/Pixel1Photos.dylib

          echo
          echo "PLIST:"
          file output/Pixel1Photos.plist

          echo
          echo "SUCCESS"


      # ==========================================
      # UPLOAD
      # ==========================================

      - name: Upload TrollFools Files
        uses: actions/upload-artifact@v4
        with:
          name: Pixel1Photos-TrollFools
          path: output/
          if-no-files-found: error
