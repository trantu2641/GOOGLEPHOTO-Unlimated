name: Build Pixel1Photos TrollFools

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            clang \
            make \
            perl \
            git \
            wget \
            curl \
            xz-utils \
            bzip2 \
            unzip \
            dpkg \
            lldb

      - name: Install Theos
        run: |
          git clone --recursive \
            https://github.com/theos/theos.git \
            "$HOME/theos"

      - name: Download iOS SDK
        run: |
          mkdir -p "$HOME/theos/sdks"

          wget -q \
            https://github.com/theos/sdks/releases/download/16.5/iPhoneOS16.5.sdk.tar.xz \
            -O /tmp/iPhoneOS16.5.sdk.tar.xz

          tar -xf \
            /tmp/iPhoneOS16.5.sdk.tar.xz \
            -C "$HOME/theos/sdks"

      - name: Check SDK
        run: |
          echo "Installed SDKs:"
          ls -lah "$HOME/theos/sdks"

      - name: Build
        env:
          THEOS: ${{ github.workspace }}/../theos
        run: |
          make clean
          make FINALPACKAGE=1

      - name: Find dylib
        run: |
          echo "Searching for dylib..."
          find .theos -type f -name "*.dylib" -print

      - name: Prepare TrollFools package
        run: |
          set -e

          mkdir -p output

          DYLIB=$(find .theos \
            -type f \
            -name "Pixel1Photos.dylib" \
            | head -n 1)

          if [ -z "$DYLIB" ]; then
            echo "ERROR: Pixel1Photos.dylib not found"
            exit 1
          fi

          cp "$DYLIB" output/Pixel1Photos.dylib

          cp Pixel1Photos.plist output/Pixel1Photos.plist

      - name: Check dylib
        run: |
          echo "===== FILE ====="
          file output/Pixel1Photos.dylib

          echo
          echo "===== ARCHITECTURE ====="
          llvm-objdump -p output/Pixel1Photos.dylib \
            | grep -E "architecture|platform|LC_BUILD_VERSION" \
            || true

          echo
          echo "===== SIZE ====="
          ls -lh output/Pixel1Photos.dylib

      - name: Upload TrollFools files
        uses: actions/upload-artifact@v4
        with:
          name: Pixel1Photos-TrollFools
          path: output/
