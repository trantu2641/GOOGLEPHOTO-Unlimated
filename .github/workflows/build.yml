name: Build Pixel1Photos TrollFools

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      THEOS: /home/runner/theos

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            clang \
            llvm \
            make \
            perl \
            git \
            curl \
            wget \
            xz-utils \
            bzip2 \
            unzip \
            dpkg \
            libtinfo6 \
            file

      - name: Install Theos
        run: |
          set -e

          rm -rf "$THEOS"

          git clone --recursive \
            https://github.com/theos/theos.git \
            "$THEOS"

          echo "THEOS=$THEOS"

          test -d "$THEOS"

      - name: Install iOS Linux Toolchain
        run: |
          set -e

          mkdir -p "$THEOS/toolchain"

          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz" \
            -o /tmp/iOSToolchain-x86_64.tar.xz

          tar -xJf \
            /tmp/iOSToolchain-x86_64.tar.xz \
            -C "$THEOS/toolchain"

          echo "Toolchain installed."

      - name: Verify Toolchain
        run: |
          set -e

          CLANG="$THEOS/toolchain/linux/iphone/bin/clang"

          test -x "$CLANG"

          "$CLANG" --version

      - name: Download iOS 16.5 SDK
        run: |
          set -e

          mkdir -p "$THEOS/sdks"

          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz" \
            -o /tmp/iPhoneOS16.5.sdk.tar.xz

          tar -xJf \
            /tmp/iPhoneOS16.5.sdk.tar.xz \
            -C "$THEOS/sdks"

          test -d \
            "$THEOS/sdks/iPhoneOS16.5.sdk"

          echo "SDK installed."

      - name: Verify Project
        run: |
          set -e

          echo "=========================================="
          echo "PROJECT"
          echo "=========================================="

          pwd

          ls -lah

          echo
          echo "===== MAKEFILE ====="

          test -f Makefile
          cat Makefile

          echo
          echo "===== TWEAK.X ====="

          test -f Tweak.x
          sed -n '1,260p' Tweak.x

          echo
          echo "===== PLIST ====="

          test -f Pixel1Photos.plist
          cat Pixel1Photos.plist

      - name: Clean
        run: |
          set -e

          make clean || true

          rm -rf .theos

      - name: Build Pixel1Photos
        run: |
          set -e

          echo "=========================================="
          echo "BUILD PIXEL1PHOTOS"
          echo "=========================================="

          make

          test -f Pixel1Photos.dylib

          echo
          echo "BUILD RESULT:"
          ls -lah Pixel1Photos.dylib

          echo
          echo "FILE TYPE:"
          file Pixel1Photos.dylib

      - name: Inspect Mach-O
        run: |
          set -e

          DYLIB="Pixel1Photos.dylib"

          echo "=========================================="
          echo "MACH-O INSPECTION"
          echo "=========================================="

          echo
          echo "FILE:"
          file "$DYLIB"

          echo
          echo "SIZE:"
          stat \
            -c "%n %s bytes" \
            "$DYLIB"

          echo
          echo "MAGIC:"
          od \
            -An \
            -tx1 \
            -N32 \
            "$DYLIB"

      - name: Locate ldid
        run: |
          set -e

          LDID="$THEOS/toolchain/linux/iphone/bin/ldid"

          if [ ! -x "$LDID" ]; then
            LDID=$(find "$THEOS/toolchain" \
              -type f \
              -name "ldid" \
              -perm -111 \
              | head -n 1)
          fi

          if [ -z "$LDID" ] || [ ! -x "$LDID" ]; then
            echo "ERROR: ldid not found."
            exit 1
          fi

          echo "LDID=$LDID"

          printf '%s\n' "$LDID" > /tmp/ldid_path

      - name: Sign dylib
        run: |
          set -e

          LDID=$(cat /tmp/ldid_path)

          echo "=========================================="
          echo "SIGN DYLIB"
          echo "=========================================="

          cp \
            Pixel1Photos.dylib \
            /tmp/Pixel1Photos-signed.dylib

          "$LDID" \
            -S \
            /tmp/Pixel1Photos-signed.dylib

          echo
          echo "SIGNING SUCCESS"

      - name: Verify signed dylib
        run: |
          set -e

          LDID=$(cat /tmp/ldid_path)

          DYLIB="/tmp/Pixel1Photos-signed.dylib"

          echo "=========================================="
          echo "VERIFY SIGNED DYLIB"
          echo "=========================================="

          echo
          echo "CDHASH:"

          "$LDID" \
            -h \
            "$DYLIB"

          echo
          echo "FILE:"

          file "$DYLIB"

          echo
          echo "SIGNED DYLIB VERIFIED"

      - name: Prepare TrollFools
        run: |
          set -e

          mkdir -p output

          cp \
            /tmp/Pixel1Photos-signed.dylib \
            output/Pixel1Photos.dylib

          cp \
            Pixel1Photos.plist \
            output/Pixel1Photos.plist

          echo
          echo "=========================================="
          echo "TROLLFOOLS OUTPUT"
          echo "=========================================="

          ls -lah output/

      - name: Final Check
        run: |
          set -e

          test -f output/Pixel1Photos.dylib
          test -f output/Pixel1Photos.plist

          echo
          echo "=========================================="
          echo "FINAL SUCCESS"
          echo "=========================================="

          file output/Pixel1Photos.dylib

          stat \
            -c "%n %s bytes" \
            output/Pixel1Photos.dylib

      - name: Upload TrollFools
        uses: actions/upload-artifact@v4
        with:
          name: Pixel1Photos-TrollFools
          path: output/
          if-no-files-found: error
