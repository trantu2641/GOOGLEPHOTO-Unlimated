name: Build Pixel1Photos TrollFools

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      THEOS: /home/runner/theos

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            clang \
            llvm \
            make \
            perl \
            git \
            curl \
            wget \
            xz-utils \
            bzip2 \
            unzip \
            dpkg \
            libtinfo6 \
            file


      # ==========================================
      # INSTALL THEOS
      # ==========================================

      - name: Install Theos
        run: |
          set -e

          rm -rf "$THEOS"

          git clone --recursive \
            https://github.com/theos/theos.git \
            "$THEOS"

          echo
          echo "=========================================="
          echo "THEOS INSTALLED"
          echo "=========================================="

          echo "THEOS=$THEOS"

          test -d "$THEOS"

          ls -lah "$THEOS"


      # ==========================================
      # INSTALL IOS TOOLCHAIN
      # ==========================================

      - name: Install iOS Linux Toolchain
        run: |
          set -e

          mkdir -p "$THEOS/toolchain"

          echo
          echo "=========================================="
          echo "DOWNLOAD IOS TOOLCHAIN"
          echo "=========================================="

          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz" \
            -o /tmp/iOSToolchain-x86_64.tar.xz

          echo
          echo "=========================================="
          echo "EXTRACT IOS TOOLCHAIN"
          echo "=========================================="

          tar -xJf \
            /tmp/iOSToolchain-x86_64.tar.xz \
            -C "$THEOS/toolchain"

          echo
          echo "=========================================="
          echo "TOOLCHAIN CONTENT"
          echo "=========================================="

          find "$THEOS/toolchain" \
            -maxdepth 5 \
            -type f \
            | head -150


      # ==========================================
      # VERIFY TOOLCHAIN
      # ==========================================

      - name: Verify Toolchain
        run: |
          set -e

          echo
          echo "=========================================="
          echo "VERIFY TOOLCHAIN"
          echo "=========================================="

          CLANG="$THEOS/toolchain/linux/iphone/bin/clang"

          test -x "$CLANG"

          echo
          echo "CLANG:"
          "$CLANG" --version

          echo
          echo "TOOLCHAIN:"
          ls -lah "$THEOS/toolchain/linux/iphone/bin"


      # ==========================================
      # INSTALL IOS SDK
      # ==========================================

      - name: Download iOS 16.5 SDK
        run: |
          set -e

          mkdir -p "$THEOS/sdks"

          echo
          echo "=========================================="
          echo "DOWNLOAD IPHONEOS 16.5 SDK"
          echo "=========================================="

          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz" \
            -o /tmp/iPhoneOS16.5.sdk.tar.xz

          echo
          echo "=========================================="
          echo "EXTRACT SDK"
          echo "=========================================="

          tar -xJf \
            /tmp/iPhoneOS16.5.sdk.tar.xz \
            -C "$THEOS/sdks"

          test -d \
            "$THEOS/sdks/iPhoneOS16.5.sdk"

          echo
          echo "SDK:"
          ls -lah "$THEOS/sdks"


      # ==========================================
      # VERIFY THEOS
      # ==========================================

      - name: Verify Theos
        run: |
          set -e

          echo
          echo "=========================================="
          echo "VERIFY THEOS"
          echo "=========================================="

          test -d "$THEOS"

          test -d \
            "$THEOS/sdks/iPhoneOS16.5.sdk"

          test -d \
            "$THEOS/toolchain/linux/iphone"

          echo
          echo "THEOS:"
          echo "$THEOS"

          echo
          echo "SDK:"
          ls -lah "$THEOS/sdks"

          echo
          echo "TOOLCHAIN:"
          ls -lah "$THEOS/toolchain/linux/iphone/bin"


      # ==========================================
      # VERIFY PROJECT
      # ==========================================

      - name: Verify Project Files
        run: |
          set -e

          echo
          echo "=========================================="
          echo "PROJECT"
          echo "=========================================="

          pwd

          echo
          echo "FILES:"
          ls -lah

          echo
          echo "=========================================="
          echo "MAKEFILE"
          echo "=========================================="

          test -f Makefile

          cat Makefile

          echo
          echo "=========================================="
          echo "TWEAK.X"
          echo "=========================================="

          test -f Tweak.x

          sed -n '1,260p' Tweak.x

          echo
          echo "=========================================="
          echo "PLIST"
          echo "=========================================="

          test -f Pixel1Photos.plist

          cat Pixel1Photos.plist


      # ==========================================
      # CLEAN
      # ==========================================

      - name: Clean
        run: |
          set -e

          make clean || true

          rm -rf .theos

          mkdir -p .theos


      # ==========================================
      # BUILD
      # ==========================================

      - name: Build Pixel1Photos
        run: |
          set -e

          echo
          echo "=========================================="
          echo "BUILD PIXEL1PHOTOS"
          echo "=========================================="

          echo "THEOS=$THEOS"

          make

          echo
          echo "BUILD RESULT:"
          ls -lah Pixel1Photos.dylib

          echo
          echo "FILE TYPE:"
          file Pixel1Photos.dylib


      # ==========================================
      # MACH-O INSPECTION
      # ==========================================

      - name: Inspect Mach-O
        run: |
          set -e

          DYLIB="Pixel1Photos.dylib"

          echo
          echo "=========================================="
          echo "MACH-O INSPECTION"
          echo "=========================================="

          echo
          echo "FILE:"
          file "$DYLIB"

          echo
          echo "SIZE:"
          stat \
            -c "%n %s bytes" \
            "$DYLIB"

          echo
          echo "MAGIC:"
          od \
            -An \
            -tx1 \
            -N32 \
            "$DYLIB"

          echo
          echo "FIRST 32 BYTES:"
          xxd \
            -l 32 \
            "$DYLIB" \
            || true


      # ==========================================
      # FIND LDID
      # ==========================================

      - name: Locate ldid
        run: |
          set -e

          echo
          echo "=========================================="
          echo "LOCATE LDID"
          echo "=========================================="

          LDID="$THEOS/toolchain/linux/iphone/bin/ldid"

          if [ ! -x "$LDID" ]; then
            LDID=$(find "$THEOS/toolchain" \
              -type f \
              -name "ldid" \
              -perm -111 \
              | head -n 1)
          fi

          if [ -z "$LDID" ] || [ ! -x "$LDID" ]; then
            echo
            echo "ERROR: ldid NOT FOUND"
            exit 1
          fi

          echo
          echo "LDID:"
          echo "$LDID"

          printf '%s\n' "$LDID" > /tmp/ldid_path


      # ==========================================
      # SIGN DYLIB
      # ==========================================

      - name: Sign dylib with ldid
        run: |
          set -e

          DYLIB="Pixel1Photos.dylib"
          LDID=$(cat /tmp/ldid_path)

          echo
          echo "=========================================="
          echo "SIGN DYLIB"
          echo "=========================================="

          echo
          echo "Using:"
          echo "$LDID"

          echo
          echo "Creating working copy..."

          cp \
            "$DYLIB" \
            /tmp/Pixel1Photos-signed.dylib

          echo
          echo "Pseudo-signing..."

          "$LDID" \
            -S \
            /tmp/Pixel1Photos-signed.dylib

          echo
          echo "SIGNING SUCCESS"


      # ==========================================
      # VERIFY SIGNATURE
      # ==========================================

      - name: Verify signed dylib
        run: |
          set -e

          LDID=$(cat /tmp/ldid_path)
          DYLIB="/tmp/Pixel1Photos-signed.dylib"

          echo
          echo "=========================================="
          echo "VERIFY SIGNED DYLIB"
          echo "=========================================="

          echo
          echo "CDHASH:"

          "$LDID" \
            -h \
            "$DYLIB"

          echo
          echo "ENTITLEMENTS:"

          "$LDID" \
            -e \
            "$DYLIB" \
            || true

          echo
          echo "FILE:"

          file "$DYLIB"


      # ==========================================
      # PREPARE TROLLFOOLS
      # ==========================================

      - name: Prepare TrollFools
        run: |
          set -e

          echo
          echo "=========================================="
          echo "PREPARE TROLLFOOLS"
          echo "=========================================="

          mkdir -p output

          cp \
            /tmp/Pixel1Photos-signed.dylib \
            output/Pixel1Photos.dylib

          cp \
            Pixel1Photos.plist \
            output/Pixel1Photos.plist

          echo
          echo "OUTPUT:"
          ls -lah output/


      # ==========================================
      # FINAL VERIFY
      # ==========================================

      - name: Final Verify
        run: |
          set -e

          echo
          echo "=========================================="
          echo "FINAL VERIFY"
          echo "=========================================="

          test -f \
            output/Pixel1Photos.dylib

          test -f \
            output/Pixel1Photos.plist

          echo
          echo "DYLIB:"
          file \
            output/Pixel1Photos.dylib

          echo
          echo "SIZE:"
          stat \
            -c "%n %s bytes" \
            output/Pixel1Photos.dylib

          echo
          echo "=========================================="
          echo "TROLLFOOLS PACKAGE READY"
          echo "=========================================="


      # ==========================================
      # UPLOAD
      # ==========================================

      - name: Upload TrollFools
        uses: actions/upload-artifact@v4
        with:
          name: Pixel1Photos-TrollFools
          path: output/
          if-no-files-found: error
