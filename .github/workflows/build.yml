name: Build Pixel1Photos TrollFools

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            clang \
            llvm \
            make \
            perl \
            git \
            curl \
            wget \
            xz-utils \
            bzip2 \
            unzip \
            dpkg

      - name: Install Theos
        run: |
          set -e

          git clone --recursive \
            https://github.com/theos/theos.git \
            "$HOME/theos"

          echo "Theos installed:"
          ls -lah "$HOME/theos"

      - name: Install iOS toolchain
        run: |
          set -e

          cd "$HOME/theos"

          echo "Installing Theos toolchain..."

          "$HOME/theos/bin/install-llvm-toolchain"

      - name: Download iOS 16.5 SDK
        run: |
          set -e

          mkdir -p "$HOME/theos/sdks"

          echo "Downloading iPhoneOS 16.5 SDK..."

          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz" \
            -o /tmp/iPhoneOS16.5.sdk.tar.xz

          echo "Extracting SDK..."

          tar -xJf \
            /tmp/iPhoneOS16.5.sdk.tar.xz \
            -C "$HOME/theos/sdks"

          echo "Installed SDKs:"
          ls -lah "$HOME/theos/sdks"

      - name: Verify Theos
        env:
          THEOS: ${{ github.workspace }}/../theos
        run: |
          set -e

          echo "===== THEOS ====="
          echo "THEOS=$THEOS"

          test -d "$THEOS"

          echo
          echo "===== THEOS DIRECTORY ====="
          ls -lah "$THEOS"

          echo
          echo "===== SDKs ====="
          ls -lah "$THEOS/sdks"

          echo
          echo "===== TOOLCHAIN ====="

          find "$THEOS/toolchain" \
            -maxdepth 3 \
            -type f \
            | head -100

      - name: Verify project files
        run: |
          set -e

          echo "===== PROJECT ====="

          ls -lah

          echo
          echo "===== Tweak.x ====="

          test -f Tweak.x
          sed -n '1,240p' Tweak.x

          echo
          echo "===== Makefile ====="

          test -f Makefile
          cat Makefile

          echo
          echo "===== Pixel1Photos.plist ====="

          test -f Pixel1Photos.plist
          cat Pixel1Photos.plist

      - name: Build dylib
        env:
          THEOS: ${{ github.workspace }}/../theos
        run: |
          set -e

          echo "===== BUILD ====="

          make clean || true

          make \
            FINALPACKAGE=1 \
            THEOS="$THEOS"

      - name: Find dylib
        run: |
          set -e

          echo "===== DYLIB SEARCH ====="

          find .theos \
            -type f \
            -name "*.dylib" \
            -print

      - name: Prepare TrollFools files
        run: |
          set -e

          mkdir -p output

          DYLIB=$(find .theos \
            -type f \
            -name "Pixel1Photos.dylib" \
            | head -n 1)

          if [ -z "$DYLIB" ]; then
            echo "ERROR: Pixel1Photos.dylib not found"
            exit 1
          fi

          echo "Found:"
          echo "$DYLIB"

          cp "$DYLIB" \
            output/Pixel1Photos.dylib

          cp Pixel1Photos.plist \
            output/Pixel1Photos.plist

      - name: Verify output
        run: |
          set -e

          echo "===== OUTPUT ====="

          ls -lah output/

          echo
          echo "===== DYLIB ====="

          file output/Pixel1Photos.dylib

          echo
          echo "===== MACH-O HEADER ====="

          llvm-objdump -p \
            output/Pixel1Photos.dylib \
            | head -100

          echo
          echo "===== ARCHITECTURE ====="

          llvm-objdump -f \
            output/Pixel1Photos.dylib

      - name: Upload TrollFools dylib
        uses: actions/upload-artifact@v4
        with:
          name: Pixel1Photos-TrollFools
          path: output/
          if-no-files-found: error
