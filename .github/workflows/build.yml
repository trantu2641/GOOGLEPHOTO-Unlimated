name: Build Pixel1Photos TrollFools

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      THEOS: /home/runner/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            clang \
            llvm \
            make \
            perl \
            git \
            curl \
            wget \
            xz-utils \
            bzip2 \
            unzip \
            dpkg \
            libtinfo6

      - name: Install Theos
        run: |
          set -e

          rm -rf "$THEOS"

          git clone --recursive \
            https://github.com/theos/theos.git \
            "$THEOS"

          echo "===== THEOS INSTALLED ====="
          echo "THEOS=$THEOS"

          test -d "$THEOS"

          ls -lah "$THEOS"

      - name: Install iOS Linux Toolchain
        run: |
          set -e

          mkdir -p "$THEOS/toolchain"

          echo "===== DOWNLOAD TOOLCHAIN ====="

          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz" \
            -o /tmp/iOSToolchain-x86_64.tar.xz

          echo "===== EXTRACT TOOLCHAIN ====="

          tar -xJf \
            /tmp/iOSToolchain-x86_64.tar.xz \
            -C "$THEOS/toolchain"

          echo
          echo "===== TOOLCHAIN CONTENT ====="

          find "$THEOS/toolchain" \
            -maxdepth 4 \
            -type f \
            | head -100

      - name: Verify Toolchain
        run: |
          set -e

          echo "===== THEOS ====="
          echo "$THEOS"

          test -d "$THEOS"

          echo
          echo "===== TOOLCHAIN DIRECTORY ====="

          find "$THEOS/toolchain" \
            -maxdepth 4 \
            -type f \
            | head -100

          echo
          echo "===== CLANG ====="

          test -x "$THEOS/toolchain/linux/iphone/bin/clang"

          "$THEOS/toolchain/linux/iphone/bin/clang" \
            --version

      - name: Download iOS 16.5 SDK
        run: |
          set -e

          mkdir -p "$THEOS/sdks"

          echo "===== DOWNLOAD SDK ====="

          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz" \
            -o /tmp/iPhoneOS16.5.sdk.tar.xz

          echo "===== EXTRACT SDK ====="

          tar -xJf \
            /tmp/iPhoneOS16.5.sdk.tar.xz \
            -C "$THEOS/sdks"

          echo
          echo "===== SDKs ====="

          ls -lah "$THEOS/sdks"

          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"

      - name: Verify Theos
        run: |
          set -e

          echo "===== THEOS ====="
          echo "THEOS=$THEOS"

          test -d "$THEOS"
          test -d "$THEOS/sdks"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"
          test -d "$THEOS/toolchain/linux/iphone"

          echo
          echo "===== SDK ====="

          ls -lah "$THEOS/sdks"

          echo
          echo "===== TOOLCHAIN ====="

          ls -lah "$THEOS/toolchain/linux/iphone/bin"

      - name: Verify Project Files
        run: |
          set -e

          echo "===== PROJECT ====="

          pwd
          ls -lah

          echo
          echo "===== Makefile ====="

          test -f Makefile
          cat Makefile

          echo
          echo "===== Tweak.x ====="

          test -f Tweak.x
          sed -n '1,240p' Tweak.x

          echo
          echo "===== Pixel1Photos.plist ====="

          test -f Pixel1Photos.plist
          cat Pixel1Photos.plist

      - name: Build dylib
        run: |
          set -e

          echo "===== BUILD ====="
          echo "THEOS=$THEOS"

          make clean || true

          make \
            FINALPACKAGE=1 \
            THEOS="$THEOS"

      - name: Find dylib
        run: |
          set -e

          echo "===== DYLIB SEARCH ====="

          find .theos \
            -type f \
            -name "*.dylib" \
            -print

      - name: Prepare TrollFools Files
        run: |
          set -e

          mkdir -p output

          DYLIB=$(find .theos \
            -type f \
            -name "Pixel1Photos.dylib" \
            | head -n 1)

          if [ -z "$DYLIB" ]; then
            echo "ERROR: Pixel1Photos.dylib not found"
            exit 1
          fi

          echo "Found:"
          echo "$DYLIB"

          cp "$DYLIB" \
            output/Pixel1Photos.dylib

          cp Pixel1Photos.plist \
            output/Pixel1Photos.plist

      - name: Verify Output
        run: |
          set -e

          echo "===== OUTPUT ====="

          ls -lah output/

          echo
          echo "===== FILE ====="

          file output/Pixel1Photos.dylib

          echo
          echo "===== MACH-O ====="

          llvm-objdump -p \
            output/Pixel1Photos.dylib \
            | head -100

          echo
          echo "===== ARCHITECTURE ====="

          llvm-objdump -f \
            output/Pixel1Photos.dylib

      - name: Upload TrollFools Files
        uses: actions/upload-artifact@v4
        with:
          name: Pixel1Photos-TrollFools
          path: output/
          if-no-files-found: error
