name: Build Pixel1Photos TrollFools

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      THEOS: /home/runner/theos

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            clang \
            llvm \
            make \
            perl \
            git \
            curl \
            wget \
            xz-utils \
            bzip2 \
            unzip \
            dpkg \
            libtinfo6 \
            file


      # ==========================================
      # THEOS
      # ==========================================

      - name: Install Theos
        run: |
          set -e

          rm -rf "$THEOS"

          git clone --recursive \
            https://github.com/theos/theos.git \
            "$THEOS"

          test -d "$THEOS"

          echo "THEOS=$THEOS"


      # ==========================================
      # IOS TOOLCHAIN
      # ==========================================

      - name: Install iOS Toolchain
        run: |
          set -e

          mkdir -p "$THEOS/toolchain"

          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz" \
            -o /tmp/iOSToolchain.tar.xz

          tar -xJf \
            /tmp/iOSToolchain.tar.xz \
            -C "$THEOS/toolchain"

          echo
          echo "Toolchain:"
          find "$THEOS/toolchain" \
            -maxdepth 5 \
            -type f \
            | head -150


      # ==========================================
      # SDK
      # ==========================================

      - name: Install iOS 16.5 SDK
        run: |
          set -e

          mkdir -p "$THEOS/sdks"

          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz" \
            -o /tmp/iPhoneOS16.5.sdk.tar.xz

          tar -xJf \
            /tmp/iPhoneOS16.5.sdk.tar.xz \
            -C "$THEOS/sdks"

          test -d \
            "$THEOS/sdks/iPhoneOS16.5.sdk"

          echo
          echo "SDK installed:"
          ls -lah "$THEOS/sdks"


      # ==========================================
      # VERIFY CLANG
      # ==========================================

      - name: Verify iOS Clang
        run: |
          set -e

          CLANG="$THEOS/toolchain/linux/iphone/bin/clang"

          test -x "$CLANG"

          echo "Using:"
          echo "$CLANG"

          "$CLANG" --version


      # ==========================================
      # VERIFY PROJECT
      # ==========================================

      - name: Verify Project
        run: |
          set -e

          echo "=========================================="
          echo "PROJECT"
          echo "=========================================="

          pwd

          ls -lah

          echo
          echo "===== Makefile ====="

          test -f Makefile
          cat Makefile

          echo
          echo "===== Tweak.x ====="

          test -f Tweak.x
          sed -n '1,260p' Tweak.x

          echo
          echo "===== Plist ====="

          test -f Pixel1Photos.plist
          cat Pixel1Photos.plist


      # ==========================================
      # BUILD
      # ==========================================

      - name: Build Pixel1Photos dylib
        run: |
          set -e

          echo "=========================================="
          echo "BUILD"
          echo "=========================================="

          make clean || true

          make

          echo
          echo "Build output:"

          ls -lah Pixel1Photos.dylib

          file Pixel1Photos.dylib


      # ==========================================
      # VERIFY MACH-O MAGIC
      # ==========================================

      - name: Inspect Mach-O
        run: |
          set -e

          echo "=========================================="
          echo "MACH-O INSPECTION"
          echo "=========================================="

          file Pixel1Photos.dylib

          echo
          echo "Magic bytes:"

          od \
            -An \
            -tx1 \
            -N32 \
            Pixel1Photos.dylib

          echo
          echo "Size:"

          stat \
            -c "%n %s bytes" \
            Pixel1Photos.dylib


      # ==========================================
      # LDID CHECK
      # ==========================================

      - name: Validate with ldid
        run: |
          set -e

          LDID="$THEOS/toolchain/linux/iphone/bin/ldid"

          test -x "$LDID"

          echo "=========================================="
          echo "LDID VALIDATION"
          echo "=========================================="

          echo
          echo "ldid:"
          "$LDID" --version || true

          echo
          echo "CDHash:"

          "$LDID" \
            -h \
            Pixel1Photos.dylib

          echo
          echo "=========================================="
          echo "LDID ACCEPTED MACH-O"
          echo "=========================================="


      # ==========================================
      # PREPARE OUTPUT
      # ==========================================

      - name: Prepare TrollFools
        run: |
          set -e

          mkdir -p output

          cp \
            Pixel1Photos.dylib \
            output/Pixel1Photos.dylib

          cp \
            Pixel1Photos.plist \
            output/Pixel1Photos.plist

          echo
          echo "=========================================="
          echo "TROLLFOOLS FILES"
          echo "=========================================="

          ls -lah output/


      # ==========================================
      # FINAL CHECK
      # ==========================================

      - name: Final Check
        run: |
          set -e

          test -f output/Pixel1Photos.dylib
          test -f output/Pixel1Photos.plist

          echo
          echo "=========================================="
          echo "SUCCESS"
          echo "=========================================="

          file output/Pixel1Photos.dylib


      # ==========================================
      # ARTIFACT
      # ==========================================

      - name: Upload TrollFools
        uses: actions/upload-artifact@v4
        with:
          name: Pixel1Photos-TrollFools
          path: output/
          if-no-files-found: error
